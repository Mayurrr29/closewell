# Render Blueprint for the backend (API + job worker + widget.js).
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo. See docs/deploy-render-vercel.md.
# The web app is deployed separately on Vercel (apps/web/vercel.json).
services:
  - type: web
    name: salesbot-ai-api
    runtime: node
    plan: free
    region: singapore
    # --include=dev: the build needs TypeScript/esbuild even though NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build -w @closewell/widget && npm run build -w @closewell/api
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - apps/api/**
        - apps/widget/**
        - packages/shared/**
        - package.json
        - package-lock.json
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Vercel proxy + Render's load balancer = 2 hops in front of the API.
      - key: TRUST_PROXY
        value: "2"
      # Random 256-bit values generated by Render on first deploy.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      # You are asked for these when you create the Blueprint.
      - key: MONGODB_URI
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: AI_PROVIDER
        value: mock
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: EMAIL_MODE
        value: mock
      - key: EMAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
